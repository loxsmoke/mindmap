name: Release

# Manually triggered. Computes the next version from version.win (dry run),
# stamps it into MindMap, builds an installable Windows release and manual
# macOS app bundles, then only after every build succeeds reserves the version
# on version.win, commits and tags the bump, and publishes a GitHub Release
# with the archives attached. The dry run means a failed build does not burn a
# version number.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: increment settings (semantic.3) 1.0.0=azz 0.1.0=az 0.0.1=a
        required: true
        default: az
        type: string
      postfix:
        description: postfix like rc or beta for a pre-release version (also marks the release as pre-release)
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.version.outputs.project }}
      assembly: ${{ steps.version.outputs.assembly }}
    steps:
      - name: Require a branch run
        if: ${{ github.ref_type != 'branch' }}
        run: |
          echo "::error::Run this workflow from the branch that should receive the version commit" >&2
          exit 1

      - name: Compute version from version.win (dry run)
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
          POSTFIX: ${{ inputs.postfix }}
          VERSION_WIN_API_KEY: ${{ secrets.VERSION_WIN_API_KEY }}
          VERSION_WIN_PROJECT_ID: ${{ secrets.VERSION_WIN_PROJECT_ID }}
        run: |
          # /dryrun computes the next version without consuming it, so a build
          # failure later does not burn a version number.
          VERSION_URL="https://api.version.win/v/${VERSION_WIN_PROJECT_ID}/dryrun?key=${VERSION_WIN_API_KEY}&increment=${INCREMENT}"

          if [ -n "$POSTFIX" ]; then
            VERSION_URL="${VERSION_URL}&postfix=${POSTFIX}"
          fi

          if ! VERSION=$(curl -sf "$VERSION_URL"); then
            echo "::error::Failed to fetch version from version.win" >&2
            exit 1
          fi

          # Strip any pre-release postfix (e.g. -rc1) for the numeric assembly version.
          BASE_VERSION="${VERSION%%-*}"
          if [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ASSEMBLY_VERSION="${BASE_VERSION}.0"
          elif [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ASSEMBLY_VERSION="$BASE_VERSION"
          else
            echo "::error::Version '$VERSION' does not start with a three-part or four-part numeric version" >&2
            exit 1
          fi

          echo "project=$VERSION" >> "$GITHUB_OUTPUT"
          echo "assembly=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"
          echo "Assembly and file version: $ASSEMBLY_VERSION"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.version.outputs.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-property
        run: dotnet tool install --global dotnet-property

      - name: Apply project version
        shell: bash
        env:
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly }}
        run: |
          # dotnet-property matches a relative glob, so run it from the
          # project's own directory with a bare filename.
          ( cd MindMap && \
            dotnet-property MindMap.csproj "Version:$VERSION" && \
            dotnet-property MindMap.csproj "AssemblyVersion:$ASSEMBLY_VERSION" && \
            dotnet-property MindMap.csproj "FileVersion:$ASSEMBLY_VERSION" )

      - name: Test
        run: dotnet test MindMap.slnx --configuration Release --verbosity normal

      - name: Publish macOS bundle
        if: runner.os == 'macOS'
        run: bash tools/publish-macos.sh ${{ matrix.rid }}

      # ditto, not zip: it preserves the bundle's permissions and ad-hoc
      # signature. Users install manually by extracting and moving the app.
      - name: Package macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent "dist/MindMap.app" \
            "artifacts/MindMap-${VERSION}-${{ matrix.rid }}.zip"

      # Self-contained so end users do not need the .NET runtime installed.
      - name: Publish Windows
        if: runner.os == 'Windows'
        run: >
          dotnet publish MindMap/MindMap.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/${{ matrix.rid }}

      - name: Strip debug symbols
        if: runner.os == 'Windows'
        shell: bash
        run: find "publish/${{ matrix.rid }}" -name '*.pdb' -delete

      - name: Package portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" `
            -DestinationPath "artifacts/MindMap-${env:VERSION}-${{ matrix.rid }}-portable.zip"

      # Inno Setup ships preinstalled on the windows-latest runner image.
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publish = (Resolve-Path "publish/${{ matrix.rid }}").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${env:VERSION}" `
            "/DSourceDir=$publish" `
            "/DAppUrl=https://github.com/${{ github.repository }}" `
            build/MindMap.iss
          Copy-Item "build/installer/MindMap-${env:VERSION}-setup.exe" -Destination artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Build succeeded, so now actually consume the version on version.win.
      - name: Reserve version on version.win
        env:
          INCREMENT: ${{ inputs.increment }}
          POSTFIX: ${{ inputs.postfix }}
          VERSION_WIN_API_KEY: ${{ secrets.VERSION_WIN_API_KEY }}
          VERSION_WIN_PROJECT_ID: ${{ secrets.VERSION_WIN_PROJECT_ID }}
        run: |
          VERSION_URL="https://api.version.win/v/${VERSION_WIN_PROJECT_ID}/new?key=${VERSION_WIN_API_KEY}&increment=${INCREMENT}"

          if [ -n "$POSTFIX" ]; then
            VERSION_URL="${VERSION_URL}&postfix=${POSTFIX}"
          fi

          if ! RESERVED=$(curl -sf "$VERSION_URL"); then
            echo "::error::Failed to reserve version on version.win" >&2
            exit 1
          fi

          # Guard against a concurrent release consuming the number between the
          # dry run and now, because the packages were already stamped.
          if [ "$RESERVED" != "$VERSION" ]; then
            echo "::error::version.win issued '$RESERVED' but the build used '$VERSION' (concurrent release?)" >&2
            exit 1
          fi
          echo "Reserved version $RESERVED"

      - name: Commit and tag version
        env:
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          # The build runners stamped their own checkouts; redo it here so the
          # commit carries the same numbers.
          dotnet tool install --global dotnet-property
          ( cd MindMap && \
            dotnet-property MindMap.csproj "Version:$VERSION" && \
            dotnet-property MindMap.csproj "AssemblyVersion:$ASSEMBLY_VERSION" && \
            dotnet-property MindMap.csproj "FileVersion:$ASSEMBLY_VERSION" )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MindMap/MindMap.csproj

          if git diff --cached --quiet; then
            echo "::error::Version update did not change the project file" >&2
            exit 1
          fi

          git commit -m "Set version $VERSION"
          git tag "$TAG"
          git push --atomic origin "HEAD:$TARGET_BRANCH" "refs/tags/$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.project }}
          name: MindMap v${{ needs.version.outputs.project }}
          prerelease: ${{ inputs.postfix != '' }}
          generate_release_notes: true
          body: |
            Self-contained builds - no .NET runtime needed on the target machine.

            Windows users can use the installer or portable zip as before.

            The macOS bundles are ad-hoc signed, not notarized: install manually
            by extracting the zip, moving MindMap.app to Applications if desired,
            then right-clicking the app and choosing Open once on first launch.
          files: artifacts/*
